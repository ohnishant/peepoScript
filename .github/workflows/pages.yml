name: Pages

on:
  push:
    branches: [main]
    # Only redeploy when the deployed artifact can actually change. The
    # playground bundles peepo.wasm, which is compiled from every Go
    # package, so any Go source change counts - but docs and workflow
    # edits do not.
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - web/**
      - assets/**
      - scripts/build-web.sh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build playground
        run: ./scripts/build-web.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
