name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run unit tests
        # Integration tests are excluded here by their TestIntegration*
        # prefix so each job owns one category. When no integration
        # tests are merged yet, -skip matches nothing and this is a no-op.
        run: gotestsum --format standard-verbose --junitfile unit-results.xml -- -skip '^TestIntegration' ./...

      - name: Report test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit tests
          path: unit-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: unit-results.xml
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run integration tests
        # Targets the pty-based REPL tests (TestIntegration* prefix).
        # They self-skip on platforms without /dev/ptmx; Ubuntu runners
        # satisfy the requirement.
        run: gotestsum --format standard-verbose --junitfile integration-results.xml -- -run '^TestIntegration' ./...

      - name: Report test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Integration tests
          path: integration-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-output
          path: integration-results.xml
          retention-days: 7

  test-guard:
    name: Test guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff test files against base
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)

          git diff --name-status "$BASE"..HEAD -- '*_test.go' > test-changes.txt || true

          old_count=$(git grep -h '^func Test' "$BASE" -- '*_test.go' | wc -l)
          new_count=$(git grep -h '^func Test' HEAD -- '*_test.go' | wc -l)

          {
            echo "base=$BASE"
            echo "old_count=$old_count"
            echo "new_count=$new_count"
            echo "has_changes=$(test -s test-changes.txt && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Post test-change notice
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          OLD_COUNT: ${{ steps.diff.outputs.old_count }}
          NEW_COUNT: ${{ steps.diff.outputs.new_count }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- peepo-test-guard -->';
            const changes = fs.readFileSync('test-changes.txt', 'utf8').trim();
            const oldCount = parseInt(process.env.OLD_COUNT);
            const newCount = parseInt(process.env.NEW_COUNT);

            const lines = [
              marker,
              '### :warning: Test files changed',
              '',
              'This PR touches test code. Agents must not delete tests or remove',
              'test cases without explicit owner approval.',
              '',
              '| | before | after |',
              '| --- | --- | --- |',
              `| Test functions | ${oldCount} | ${newCount} |`,
              '',
              '<details><summary>Changed test files</summary>',
              '',
              '```',
              changes,
              '```',
              '',
              '</details>',
            ].join('\n');

            if (newCount < oldCount) {
              lines.push(
                '',
                `**:x: Net loss of ${oldCount - newCount} test function(s). This check fails`,
                'until the owner reviews and approves the removal.**',
              );
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: lines.join('\n'),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: lines.join('\n'),
              });
            }

      - name: Fail on removed tests
        if: steps.diff.outputs.new_count < steps.diff.outputs.old_count
        run: |
          echo "::error::Test functions were removed ($OLD_COUNT -> $NEW_COUNT). Owner approval required."
          exit 1
        env:
          OLD_COUNT: ${{ steps.diff.outputs.old_count }}
          NEW_COUNT: ${{ steps.diff.outputs.new_count }}
